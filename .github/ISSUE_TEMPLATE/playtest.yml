name: Playtest problem
description: Report a crash, setup failure, or gameplay issue.
title: "[Playtest] "
body:
  - type: input
    id: version
    attributes:
      label: Launcher version and Windows version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the level or menu, buttons pressed, expected behavior, and what happened.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: GPU and controller
      description: Include whether keyboard or controller input was used.
  - type: textarea
    id: report
    attributes:
      label: Support report
      description: Attach the ZIP from Create support report in the launcher. Do not attach ROMs, saves, raw setup logs, game assets, or memory dumps.
