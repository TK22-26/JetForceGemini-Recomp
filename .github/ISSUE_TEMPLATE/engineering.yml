name: Engineering task
description: A bounded implementation, research, or test task
title: "[task] "
labels:
  - needs-triage
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - blocker
        - reverse-engineering
        - runtime
        - overlay
        - rsp
        - graphics
        - audio
        - input
        - save
        - compatibility
        - test-infrastructure
        - documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
      description: Describe observed behavior without attaching private or ROM-derived material.
    validations:
      required: true
  - type: textarea
    id: first_observed_in
    attributes:
      label: First observed in
    validations:
      required: true
  - type: textarea
    id: first_divergence
    attributes:
      label: First divergence
      description: Use an opaque checkpoint when private addresses or symbols would be required.
    validations:
      required: true
  - type: textarea
    id: affected_scenarios
    attributes:
      label: Affected scenarios
    validations:
      required: true
  - type: textarea
    id: affected_symbols
    attributes:
      label: Affected symbols
      description: Use public-safe opaque identifiers only.
    validations:
      required: true
  - type: textarea
    id: affected_overlays
    attributes:
      label: Affected overlays
      description: Use opaque overlay identifiers only.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Do not attach ROM-derived bodies, unrestricted logs, or local paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: oracle
    attributes:
      label: Oracle
      description: Identify the approved oracle without attaching private evidence.
    validations:
      required: true
  - type: textarea
    id: current_evidence
    attributes:
      label: Current evidence
    validations:
      required: true
  - type: textarea
    id: unknowns
    attributes:
      label: Unknowns
    validations:
      required: true
  - type: textarea
    id: test_to_add
    attributes:
      label: Test to add
    validations:
      required: true
  - type: textarea
    id: scope_limit
    attributes:
      label: Scope limit
    validations:
      required: true
  - type: textarea
    id: exit_criteria
    attributes:
      label: Exit criteria
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - low
        - medium
        - high
        - restricted
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Use an approved handle or role, never a private identity.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data boundary
      options:
        - label: This issue contains no ROM-derived expressive material or private information.
          required: true
