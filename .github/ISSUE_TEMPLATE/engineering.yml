name: Development proposal
description: Propose a focused code, tooling, or documentation change
title: "[proposal] "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        For a problem encountered while playing or installing, use the playtest report.
        Check existing issues before proposing a change.
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: What would this improve? Link related issues when available.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe a focused outcome. Implementation details are optional.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How could we verify it?
      description: Suggest a test or example, if known.
    validations:
      required: false
