name: ROM-free CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy and schema validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Install validation dependency
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Reject private or forbidden material
        run: python scripts/check_repository_hygiene.py --history
      - name: Validate schemas and manifests
        run: python scripts/validate_project.py
      - name: Run Python tests
        # JFG_QUARANTINE_TRAP_PROBE skips the environment-incompatible seccomp
        # escape probe on the runner (see docs/tests/quarantine.md).
        env:
          JFG_QUARANTINE_TRAP_PROBE: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build:
    name: Build (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: |
          cmake --preset linux
          cmake --preset linux-release
          cmake --preset linux-clang
      - name: Build and test Linux
        if: runner.os == 'Linux'
        # -E excludes the quarantined trap-probe test by name without editing
        # any build-closure-pinned file (see docs/tests/quarantine.md); it
        # still builds and runs locally.
        run: |
          cmake --build --preset linux
          ctest --preset linux -E "^jfg\.g2_trap_probe_runtime$"
          cmake --build --preset linux-release
          ctest --preset linux-release -E "^jfg\.g2_trap_probe_runtime$"
          cmake --build --preset linux-clang
          ctest --preset linux-clang -E "^jfg\.g2_trap_probe_runtime$"
      - name: Build and test Windows Debug
        if: runner.os == 'Windows'
        run: python scripts/build_windows.py --config Debug --test
      - name: Build and test Windows Release
        # The trap-probe quarantine is Linux-runner-specific (see
        # docs/tests/quarantine.md); it passes on Windows and runs here.
        if: runner.os == 'Windows'
        run: |
          python scripts/build_windows.py --config Release --test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  renderer:
    name: RT64 renderer shell (Windows)
    timeout-minutes: 45
    runs-on: windows-2022
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Check out the pinned RT64 revision
        # RT64 vendors SDL2 and dxc for Windows, so the pinned checkout plus
        # its submodules is the whole dependency set for this lane.
        run: python scripts/bootstrap_tools.py --only rt64
      - name: Configure with the renderer enabled
        run: >
          cmake --preset windows-msvc
          -DJFG_ENABLE_RT64=ON
          -DJFG_RT64_ROOT=tools/upstream/rt64
      - name: Build and run the renderer shell tests
        run: |
          cmake --build --preset windows-msvc --target jfg_rt64_shell_tests
          ctest --preset windows-msvc -R "^jfg\.rt64_shell$" --output-on-failure

  sanitize:
    name: Sanitizers (Linux)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure with the project AddressSanitizer option and UBSan
        # JFG_ENABLE_ADDRESS_SANITIZER exercises the same toolchain branch
        # the identified Phase 6 sanitizer build uses (and relaxes the
        # object-shape audit that ASan metadata would otherwise fail). UBSan
        # is layered on top with plain flags because the option is ASan-only.
        run: >
          cmake -S . -B build/asan
          -DCMAKE_BUILD_TYPE=Debug
          -DJFG_ENABLE_ADDRESS_SANITIZER=ON
          -DJFG_BUILD_SYNTHETIC_GENERATED_TESTS=OFF
          "-DCMAKE_C_FLAGS=-fsanitize=undefined -fno-sanitize-recover=all"
          "-DCMAKE_CXX_FLAGS=-fsanitize=undefined -fno-sanitize-recover=all"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=undefined"
      - name: Build and run the full test set under sanitizers
        run: |
          cmake --build build/asan
          ctest --test-dir build/asan -E "^jfg\.g2_trap_probe_runtime$" --output-on-failure

  launcher:
    name: Windows launcher
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Compile and test the standalone launcher
        shell: powershell
        run: ./scripts/build_launcher.ps1 -Test
      - name: Validate bootstrap derivation with ROM-free fixtures
        shell: powershell
        run: python -m unittest discover -s tests -p test_rom_bootstrap.py
      - name: Verify the launcher-only package
        shell: powershell
        run: python scripts/package_launcher.py
