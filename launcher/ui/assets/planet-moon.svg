<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Planet, moon, and orbit trail</title>
  <desc id="desc">A blue planet with flowing atmospheric bands, a small ivory moon, and a tapered blue orbit trail wrapping behind and in front of the planet. Square canvas with a transparent background.</desc>
  <defs>
    <radialGradient id="planet" cx="0.29" cy="0.23" r="0.85">
      <stop offset="0" stop-color="#9BEDF5"/>
      <stop offset="0.30" stop-color="#4FB5EB"/>
      <stop offset="0.64" stop-color="#397BDA"/>
      <stop offset="1" stop-color="#233E91"/>
    </radialGradient>
    <linearGradient id="bands" x1="320" y1="320" x2="666" y2="715" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9F5FB" stop-opacity="0.70"/>
      <stop offset="0.55" stop-color="#77C6F0" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#588BE0" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="shadow" x1="345" y1="360" x2="696" y2="684" gradientUnits="userSpaceOnUse">
      <stop offset="0.37" stop-color="#132F7C" stop-opacity="0"/>
      <stop offset="1" stop-color="#162E76" stop-opacity="0.40"/>
    </linearGradient>
    <linearGradient id="orbit" x1="178" y1="778" x2="837" y2="307" gradientUnits="userSpaceOnUse">
      <stop stop-color="#596FD2"/>
      <stop offset="0.45" stop-color="#8D9AF4"/>
      <stop offset="0.78" stop-color="#7AD9F1"/>
      <stop offset="1" stop-color="#ACF0F5"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.28" cy="0.24" r="0.86">
      <stop stop-color="#FFFDF2"/>
      <stop offset="0.55" stop-color="#F1EFDF"/>
      <stop offset="1" stop-color="#AEBBD0"/>
    </radialGradient>
    <linearGradient id="crater" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#97A5B9"/>
      <stop offset="1" stop-color="#D4D9DB"/>
    </linearGradient>
    <clipPath id="planet-clip"><circle cx="488" cy="508" r="222"/></clipPath>
    <clipPath id="moon-clip"><circle cx="0" cy="0" r="55"/></clipPath>
  </defs>

  <!-- Far side of the moon's trailing orbit. -->
  <path id="orbit-back" d="M 465.63 309.41 L 447.68 320.66 L 429.86 332.45 L 412.20 344.73 L 394.76 357.48 L 377.57 370.66 L 360.69 384.22 L 344.17 398.14 L 328.05 412.38 L 312.37 426.88 L 297.18 441.62 L 282.51 456.56 L 268.42 471.65 L 254.94 486.85 L 242.10 502.11 L 229.94 517.40 L 218.50 532.68 L 207.80 547.90 L 197.88 563.01 L 188.76 577.98 L 180.47 592.76 L 173.04 607.31 L 166.47 621.59 L 160.80 635.55 L 156.03 649.17 L 152.18 662.38 L 149.26 675.17 L 147.27 687.48 L 146.21 699.27 L 146.09 710.52 L 146.89 721.19 L 148.60 731.24 L 151.22 740.66 L 154.72 749.41 L 159.10 757.49 L 164.32 764.88 L 159.20 768.88 L 153.73 760.73 L 149.21 751.91 L 145.67 742.46 L 143.10 732.41 L 141.51 721.79 L 140.89 710.63 L 141.22 698.97 L 142.52 686.84 L 144.76 674.25 L 147.94 661.25 L 152.04 647.86 L 157.06 634.11 L 162.98 620.05 L 169.78 605.70 L 177.44 591.11 L 185.94 576.31 L 195.26 561.33 L 205.38 546.23 L 216.26 531.04 L 227.88 515.80 L 240.21 500.55 L 253.20 485.34 L 266.84 470.19 L 281.07 455.17 L 295.86 440.30 L 311.18 425.62 L 326.97 411.18 L 343.20 397.01 L 359.82 383.16 L 376.79 369.66 L 394.06 356.54 L 411.58 343.85 L 429.30 331.62 L 447.18 319.87 L 465.16 308.64 Z" fill="url(#orbit)" opacity="0.64"/>

  <!-- Planet: all surface details remain editable vector shapes. -->
  <g id="planet-body">
    <circle cx="488" cy="508" r="222" fill="url(#planet)"/>
    <g clip-path="url(#planet-clip)">
      <g transform="rotate(-16 488 508)" fill="url(#bands)">
        <path d="M 252 353 C 347 310 390 382 488 376 C 579 370 622 326 726 369 L 726 400 C 610 352 573 417 471 409 C 368 401 337 348 252 389 Z"/>
        <path d="M 242 451 C 336 408 371 485 470 471 C 554 459 590 423 738 462 L 738 501 C 603 455 561 513 461 504 C 355 494 320 449 242 490 Z"/>
        <path d="M 240 550 C 321 505 381 579 472 567 C 568 554 626 514 741 561 L 741 586 C 621 551 571 609 466 598 C 369 588 320 542 240 586 Z"/>
        <path d="M 267 658 C 360 609 411 668 497 653 C 596 636 644 616 709 647 L 709 675 C 629 651 592 690 494 685 C 401 680 355 646 267 689 Z"/>
      </g>
      <circle cx="488" cy="508" r="222" fill="url(#shadow)"/>
      <path d="M 309 398 A 203 203 0 0 1 441 308" stroke="#D3FAFF" stroke-opacity="0.64" stroke-width="8" stroke-linecap="round"/>
    </g>
    <circle cx="488" cy="508" r="220.8" stroke="#2D599F" stroke-opacity="0.25" stroke-width="2.4"/>
  </g>

  <!-- Near side: the trail widens gradually toward the moon. -->
  <path id="orbit-front" d="M 164.32 764.88 L 170.39 771.59 L 177.29 777.59 L 185.02 782.89 L 193.55 787.47 L 202.89 791.33 L 213.01 794.44 L 223.89 796.79 L 235.50 798.38 L 247.82 799.20 L 260.80 799.23 L 274.42 798.48 L 288.63 796.94 L 303.39 794.61 L 318.67 791.51 L 334.41 787.63 L 350.58 782.99 L 367.12 777.59 L 383.99 771.46 L 401.15 764.61 L 418.54 757.05 L 436.11 748.81 L 453.82 739.92 L 471.62 730.38 L 489.45 720.24 L 507.28 709.51 L 525.03 698.23 L 542.68 686.43 L 560.16 674.14 L 577.43 661.40 L 594.44 648.24 L 611.15 634.70 L 627.50 620.81 L 643.45 606.61 L 658.95 592.15 L 673.97 577.47 L 688.46 562.59 L 702.38 547.58 L 715.68 532.47 L 728.34 517.30 L 740.32 502.12 L 751.57 486.97 L 762.08 471.90 L 771.81 456.96 L 780.73 442.17 L 788.82 427.60 L 796.06 413.29 L 802.43 399.29 L 807.90 385.63 L 812.48 372.37 L 816.14 359.56 L 818.89 347.23 L 820.74 335.45 L 821.68 324.24 L 821.73 313.65 L 820.92 303.72 L 842.69 301.30 L 843.30 313.19 L 842.89 325.51 L 841.48 338.24 L 839.08 351.35 L 835.73 364.81 L 831.45 378.61 L 826.23 392.70 L 820.12 407.08 L 813.12 421.70 L 805.27 436.53 L 796.57 451.54 L 787.05 466.70 L 776.74 481.97 L 765.67 497.30 L 753.86 512.67 L 741.36 528.03 L 728.18 543.35 L 714.36 558.58 L 699.95 573.68 L 684.99 588.61 L 669.50 603.35 L 653.53 617.83 L 637.13 632.04 L 620.33 645.92 L 603.20 659.44 L 585.76 672.57 L 568.06 685.27 L 550.16 697.50 L 532.10 709.24 L 513.94 720.44 L 495.71 731.09 L 477.47 741.15 L 459.27 750.58 L 441.15 759.38 L 423.17 767.51 L 405.37 774.95 L 387.80 781.68 L 370.51 787.68 L 353.54 792.93 L 336.94 797.43 L 320.76 801.15 L 305.02 804.08 L 289.79 806.22 L 275.08 807.56 L 260.96 808.08 L 247.45 807.80 L 234.58 806.70 L 222.40 804.78 L 210.94 802.04 L 200.23 798.50 L 190.31 794.14 L 181.21 788.98 L 172.98 783.04 L 165.63 776.33 L 159.20 768.88 Z" fill="url(#orbit)" stroke="#506AB6" stroke-opacity="0.22" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Moon positioned precisely at the leading end of the trail. -->
  <g id="moon-body" transform="translate(831.80 302.51)">
    <circle r="56.2" fill="#687AA1"/>
    <circle r="55" fill="url(#moon)"/>
    <g clip-path="url(#moon-clip)">
      <path d="M 18 -53 C 50 -23 48 20 17 52 C 42 47 61 22 58 -6 C 57 -27 42 -45 18 -53 Z" fill="#7F95B6" opacity="0.17"/>
      <ellipse cx="-17" cy="-15" rx="13.5" ry="11.5" transform="rotate(-28 -17 -15)" fill="url(#crater)" opacity="0.66"/>
      <path d="M -29 -15 C -26 -27 -10 -31 -4 -20" stroke="#FFFFF4" stroke-opacity="0.77" stroke-width="2.2" stroke-linecap="round"/>
      <ellipse cx="19" cy="18" rx="10" ry="11.5" transform="rotate(24 19 18)" fill="url(#crater)" opacity="0.61"/>
      <path d="M 11 13 C 15 5 25 6 29 14" stroke="#FFFFF4" stroke-opacity="0.58" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="-19" cy="24" r="5.5" fill="#A5B0C0" opacity="0.62"/>
      <circle cx="17" cy="-28" r="4" fill="#B0B8C4" opacity="0.52"/>
      <path d="M -42 -18 A 45 45 0 0 1 -13 -43" stroke="#FFFFFF" stroke-opacity="0.78" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
